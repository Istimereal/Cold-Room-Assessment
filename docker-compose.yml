services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: coldroom
      POSTGRES_PASSWORD: coldroom
      POSTGRES_DB: coldroom
    ports:
      - "5432:5432"
    volumes:
      - coldroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldroom -d coldroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coldroom-postgres:
